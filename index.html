<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Seat Manager</title>
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto flex w-full max-w-2xl flex-col gap-6 px-4 py-8">
      <header>
        <h1 class="text-3xl font-semibold">Cinema Seat Manager</h1>
        <p class="mt-1 text-stone-400">Pulsa un asiento libre para reservarlo.</p>
      </header>

      <section aria-label="Resumen de la sala" class="grid grid-cols-2 gap-3">
        <p class="rounded-lg bg-stone-900 p-4">
          <span class="block text-sm text-stone-400">Ocupados</span>
          <span id="ocupados" class="text-2xl font-semibold"></span>
        </p>
        <p class="rounded-lg bg-stone-900 p-4">
          <span class="block text-sm text-stone-400">Disponibles</span>
          <span id="disponibles" class="text-2xl font-semibold"></span>
        </p>
      </section>

      <section aria-label="Mapa de asientos" class="rounded-lg bg-stone-900 p-3 sm:p-5">
        <p class="mx-auto mb-5 w-3/4 rounded-sm bg-stone-300 py-1 text-center text-xs tracking-widest text-stone-900">
          PANTALLA
        </p>
        <div id="mapa" class="grid gap-1 sm:gap-1.5" style="grid-template-columns: repeat(11, minmax(0, 1fr))"></div>
      </section>

      <p id="mensaje" role="status" class="min-h-12 rounded-lg border border-stone-700 p-3"></p>

      <section aria-label="Acciones" class="flex flex-wrap gap-3">
        <button id="buscar" type="button" class="rounded-lg bg-amber-400 px-4 py-2 font-medium text-stone-950 hover:bg-amber-300">
          Buscar asientos contiguos
        </button>
        <button id="reiniciar" type="button" class="rounded-lg border border-stone-500 px-4 py-2 font-medium hover:bg-stone-800">
          Reiniciar sala
        </button>
      </section>

      <ul aria-label="Leyenda" class="flex flex-wrap gap-4 text-sm text-stone-300">
        <li class="flex items-center gap-2"><span class="size-4 rounded-sm bg-emerald-200"></span>Libre</li>
        <li class="flex items-center gap-2"><span class="size-4 rounded-sm bg-red-300"></span>Ocupado</li>
        <li class="flex items-center gap-2"><span class="size-4 rounded-sm bg-amber-400"></span>Par contiguo</li>
      </ul>
    </main>
    <script type="module" src="/src/web.ts"></script>
  </body>
</html>
